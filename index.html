function openModal(title,subtitle,body,submitText,formId,width=''){const host=$('modalHost');host.innerHTML=`<section class="modal ${width}" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><h2 class="modal-title" id="modalTitle">${title}</h2><p class="modal-subtitle">${subtitle}</p></div><button class="close-btn" data-action="close-modal" aria-label="Chiudi">${ico('close')}</button></div><div class="modal-body">${body}</div><div class="modal-footer"><button class="btn" data-action="close-modal" type="button">Annulla</button><button class="btn primary" type="submit" form="${formId}">${ico('check')} ${submitText}</button></div></section>`;document.body.style.overflow='hidden';setTimeout(()=>{const first=host.querySelector('input:not([type="hidden"]):not([type="file"]),select,textarea');if(first)first.focus()},0)}

function presetButtons(q=''){const normalized=String(q).toLocaleLowerCase('it');const matches=allFoodCatalog().filter(x=>x.name.toLocaleLowerCase('it').includes(normalized)).slice(0,9);return matches.length?matches.map(x=>`<button type="button" class="catalog-option" data-action="food-preset" data-name="${escapeHTML(x.name)}">${escapeHTML(x.emoji||'🍽️')} ${escapeHTML(x.name)}</button>`).join(''):`<div class="subtle-note">Nessuna corrispondenza. Puoi inserire un alimento personalizzato.</div>`}
function openFoodModal(existingId=null,preset='',preferPhoto=false){const existing=state.foods.find(f=>f.id===existingId);view.modal={type:'food',id:existing?.id||null};view.photo=existing?.photo||null;let chosen=FOOD_LIBRARY.find(f=>f.name===preset)||allFoodCatalog().find(f=>f.name===preset);const d=existing||chosen||{name:'',grams:150,kcal:'',protein:'',carbs:'',fat:'',meal:'Pranzo',date:view.nutritionDate};
const body=`<form id="foodForm" class="stack"><div><div class="form-section-label">Cerca un alimento</div><label class="field search-box">${ico('search')}<input id="foodSearch" autocomplete="off" placeholder="Es. mela, riso cotto, tonno..." aria-label="Cerca nel catalogo"></label><div class="catalog-results" id="catalogResults">${presetButtons()}</div></div><div class="field-grid"><label class="field full-width">Nome alimento<input required maxlength="85" id="foodName" name="name" value="${escapeHTML(d.name)}" placeholder="Nome dell'alimento"></label><label class="field">Quantità consumata (g)<input required type="number" min="0.1" max="20000" step="any" name="grams" id="foodGrams" value="${escapeHTML(d.grams)}"></label><label class="field">Pasto<select id="foodMeal" name="meal">${MEALS.map(m=>`<option ${m===d.meal?'selected':''}>${m}</option>`).join('')}</select></label><label class="field">Calorie / 100 g<input required type="number" min="0" max="1000" step="any" id="foodKcal" name="kcal" value="${escapeHTML(d.kcal)}" placeholder="52"></label><label class="field">Proteine / 100 g<input required type="number" min="0" max="100" step="any" id="foodProtein" name="protein" value="${escapeHTML(d.protein)}" placeholder="0.3"></label><label class="field">Carboidrati / 100 g<input required type="number" min="0" max="100" step="any" id="foodCarbs" name="carbs" value="${escapeHTML(d.carbs)}" placeholder="14"></label><label class="field">Grassi / 100 g<input required type="number" min="0" max="100" step="any" id="foodFat" name="fat" value="${escapeHTML(d.fat)}" placeholder="0.2"></label><label class="field full-width">Data<input type="date" name="date" required value="${escapeHTML(d.date||view.nutritionDate)}"></label></div>
<div class="food-preview"><div><div class="meta-label">PER LA QUANTITÀ INDICATA</div><div id="foodPreviewMacro" class="macros">P 0 g · C 0 g · G 0 g</div></div><div class="kcal"><span id="foodPreviewKcal">0</span> <span class="small dim">kcal</span></div></div>
<div><div class="form-section-label">Foto del piatto <span class="subtle-note">facoltativa</span></div><div class="photo-upload"><div class="photo-upload-preview" id="photoPreview">${view.photo?`<img alt="Foto alimento" src="${escapeHTML(view.photo)}">`:ico('camera','lg')}</div><div class="photo-upload-text"><strong id="photoLabel">${view.photo?'Foto già allegata':'Scatta o scegli una foto'}</strong><span>Allega una foto al diario. Alimento e grammi vanno confermati da te: nessun riconoscimento AI attivo.</span></div><input id="foodPhoto" type="file" accept="image/*" capture="environment" aria-label="Seleziona foto del cibo"></div></div>
<label style="display:flex;gap:9px;align-items:center;font-size:12px;color:var(--muted)"><input style="width:auto;accent-color:var(--accent)" type="checkbox" name="saveCustom" ${existing?'':'checked'}> Salva anche tra i miei alimenti rapidi (opzionale)</label>

openModal(existing?'Modifica alimento':'Aggiungi alimento','Seleziona un alimento o inserisci i valori per 100 g.',body,existing?'Salva modifiche':'Aggiungi al diario','foodForm','wide');updateFoodPreview();if(preferPhoto){$('foodPhoto').focus()}}
function updateFoodPreview(){if(!$('foodGrams'))return;const g=Math.max(0,num($('foodGrams').value))/100;$('foodPreviewKcal').textContent=fmt(g*num($('foodKcal').value));$('foodPreviewMacro').textContent=`P ${fmt(g*num($('foodProtein').value),1)} g · C ${fmt(g*num($('foodCarbs').value),1)} g · G ${fmt(g*num($('foodFat').value),1)} g`}
function applyFoodPreset(name){const item=allFoodCatalog().find(x=>x.name===name);if(!item)return;for(const [key,id] of [['name','foodName'],['kcal','foodKcal'],['protein','foodProtein'],['carbs','foodCarbs'],['fat','foodFat']])$(id).value=item[key];updateFoodPreview();$('foodGrams').focus();$('foodGrams').select()}
async function compressPhoto(file){if(!file.type.startsWith('image/'))throw Error('Seleziona una foto valida.');if(file.size>18*1024*1024)throw Error('Foto troppo grande (massimo 18 MB).');const img=new Image();const uri=URL.createObjectURL(file);try{await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=uri});const scale=Math.min(1,340/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');if(!ctx)throw Error('Anteprima foto non disponibile.');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);const result=canvas.toDataURL('image/jpeg',.63);if(result.length>210000)throw Error('Foto troppo grande da salvare. Prova con un’immagine più leggera.');return result}finally{URL.revokeObjectURL(uri)}}
function saveFood(form){const f=Object.fromEntries(new FormData(form).entries());const item={id:view.modal?.id||sid(),name:String(f.name||'').trim(),grams:Number(f.grams),date:String(f.date),meal:String(f.meal),kcal:Number(f.kcal),protein:Number(f.protein),carbs:Number(f.carbs),fat:Number(f.fat),photo:view.photo||null};if(!item.name||!/^\d{4}-\d{2}-\d{2}$/.test(item.date)||!MEALS.includes(item.meal)||!Number.isFinite(item.grams)||item.grams<=0||item.grams>20000||!['kcal','protein','carbs','fat'].every(k=>Number.isFinite(item[k])&&item[k]>=0&&item[k]<=(k==='kcal'?1000:100))){showToast('Controlla nome, grammi e valori nutrizionali.');return}
const index=state.foods.findIndex(x=>x.id===item.id);if(index>=0)state.foods[index]=item;else state.foods.push(item);
if(f.saveCustom==='on'){const custom={name:item.name,kcal:item.kcal,protein:item.protein,carbs:item.carbs,fat:item.fat,emoji:'🍽️'};const idx=state.customFoods.findIndex(x=>x.name.toLocaleLowerCase('it')===item.name.toLocaleLowerCase('it'));if(idx>=0)state.customFoods[idx]=custom;else state.customFoods.push(custom)}
view.nutritionDate=item.date;if(!saveState()){showToast('Salvataggio non riuscito: esporta i dati e rimuovi foto vecchie.');return}closeModal();render();showToast('Alimento salvato nel diario.')}
function openRoutineModal(id=null){const current=state.routines.find(r=>r.id===id);view.modal={type:'routine',id:current?.id||null};openModal(current?'Modifica scheda':'Nuova scheda','Organizza gli esercizi con il nome che preferisci.',`<form id="routineForm" class="stack"><label class="field">Nome della scheda<input name="name" maxlength="70" required placeholder="Es. Upper A, Lower B" value="${escapeHTML(current?.name||'')}"></label><p class="subtle-note">Dopo il salvataggio potrai aggiungere gli esercizi con serie e ripetizioni previste.</p></form>`,current?'Salva scheda':'Crea scheda','routineForm')}
function saveRoutine(form){const name=String(new FormData(form).get('name')||'').trim();if(!name){showToast('Inserisci un nome.');return}let routine=state.routines.find(r=>r.id===view.modal?.id);if(routine)routine.name=name;else{routine={id:sid(),name,exercises:[]};state.routines.push(routine)}view.selectedRoutine=routine.id;saveState();closeModal();go('workout');showToast('Scheda salvata.')}
function openRoutineExerciseModal(routineId,exerciseId=null){const r=state.routines.find(x=>x.id===routineId);if(!r)return;const prev=safeArr(r.exercises).find(x=>x.id===exerciseId);view.modal={type:'routine-exercise',routineId,id:prev?.id||null};openModal(prev?'Modifica esercizio':'Aggiungi esercizio',`Scheda: ${escapeHTML(r.name)}`,`<form id="routineExerciseForm" class="stack"><label class="field">Esercizio<input name="name" required maxlength="85" list="exerciseHints" value="${escapeHTML(prev?.name||'')}" placeholder="Es. Incline Bench Press"></label><datalist id="exerciseHints">${EXERCISES.map(x=>`<option value="${escapeHTML(x)}"></option>`).join('')}</datalist><div class="field-grid"><label class="field">Numero di serie<input type="number" name="sets" required min="1" max="20" step="1" value="${escapeHTML(prev?.sets||3)}"></label><label class="field">Target ripetizioni<input name="reps" maxlength="30" required value="${escapeHTML(prev?.reps||'8–12')}" placeholder="Es. 8–12"></label></div></form>`,prev?'Salva esercizio':'Aggiungi','routineExerciseForm')}
function saveRoutineExercise(form){const vals=Object.fromEntries(new FormData(form).entries()),name=String(vals.name||'').trim(),sets=Number(vals.sets),reps=String(vals.reps||'').trim();const r=state.routines.find(x=>x.id===view.modal?.routineId);if(!r||!name||!Number.isInteger(sets)||sets<1||sets>20||!reps){showToast('Controlla i dati dell’esercizio.');return}r.exercises=safeArr(r.exercises);let e=r.exercises.find(x=>x.id===view.modal?.id);if(e)Object.assign(e,{name,sets,reps});else r.exercises.push({id:sid(),name,sets,reps});saveState();closeModal();render();showToast('Esercizio aggiunto alla scheda.')}
function renderSetRow(index,kg='',reps=''){return `<div class="set-row"><div class="set-index">${index}</div><label class="field"><span>Kg</span><input type="number" class="set-kg" min="0" max="1500" step="any" placeholder="40" value="${escapeHTML(kg)}" required></label><label class="field"><span>Ripetizioni</span><input type="number" class="set-reps" min="1" max="100" step="1" placeholder="8" value="${escapeHTML(reps)}" required></label><button type="button" class="set-remove" data-action="remove-set" aria-label="Rimuovi serie">${ico('close')}</button></div>`}
function openWorkModal(existingId=null,exercise='',routineId=null){const existing=state.workouts.find(w=>w.id===existingId);view.modal={type:'workout',id:existing?.id||null};const routine=state.routines.find(r=>r.id===(routineId||existing?.routineId));const planExercise=routine?.exercises.find(e=>e.name===exercise);const sets=existing?.sets||Array.from({length:Math.min(10,planExercise?.sets||3)},()=>({kg:'',reps:''}));const name=existing?.exercise||exercise;const body=`<form id="workoutForm" class="stack"><div class="field-grid"><label class="field full-width">Esercizio<input name="exercise" maxlength="85" required list="exerciseHints" placeholder="Es. Bench Press" value="${escapeHTML(name)}"></label><datalist id="exerciseHints">${EXERCISES.map(x=>`<option value="${escapeHTML(x)}"></option>`).join('')}</datalist><label class="field">Data<input name="date" type="date" required value="${escapeHTML(existing?.date||TODAY())}"></label><label class="field">Scheda (facoltativa)<select name="routineId"><option value="">Senza scheda</option>${state.routines.map(r=>`<option value="${escapeHTML(r.id)}" ${r.id===(routine?.id||existing?.routineId)?'selected':''}>${escapeHTML(r.name)}</option>`).join('')}</select></label></div><div><div class="form-section-label">Serie effettive <span class="subtle-note">Inserisci il peso e le reps di ogni serie</span></div><div id="setRows">${safeArr(sets).map((s,i)=>renderSetRow(i+1,s.kg,s.reps)).join('')}</div><button class="btn sm" type="button" data-action="add-set" id="addSetButton">${ico('plus')} Aggiungi serie</button></div><label class="field">Note (facoltative)<textarea name="note" rows="2" maxlength="400" placeholder="Es. tecnica pulita, RIR 2...">${escapeHTML(existing?.note||'')}</textarea></label></form>`;
openModal(existing?'Modifica allenamento':'Registra esercizio','I grafici useranno i dati delle serie che inserisci davvero.',body,existing?'Salva modifiche':'Salva allenamento','workoutForm','wide')}
function reindexSets(){const rows=[...document.querySelectorAll('#setRows .set-row')];rows.forEach((row,i)=>row.querySelector('.set-index').textContent=i+1)}
function saveWorkout(form){const vals=Object.fromEntries(new FormData(form).entries());const name=String(vals.exercise||'').trim();const rows=[...form.querySelectorAll('.set-row')];const sets=rows.map(r=>({kg:Number(r.querySelector('.set-kg').value),reps:Number(r.querySelector('.set-reps').value)}));if(!name||!/^\d{4}-\d{2}-\d{2}$/.test(vals.date)||!sets.length||sets.some(x=>!Number.isFinite(x.kg)||x.kg<0||x.kg>1500||!Number.isInteger(x.reps)||x.reps<1||x.reps>100)){showToast('Controlla l’esercizio e tutte le serie.');return}const id=view.modal?.id||sid();const record={id,exercise:name,date:vals.date,routineId:state.routines.some(r=>r.id===vals.routineId)?vals.routineId:null,sets,note:String(vals.note||'').slice(0,400)};const idx=state.workouts.findIndex(x=>x.id===id);if(idx>=0)state.workouts[idx]=record;else state.workouts.push(record);view.selectedExercise=name;if(!saveState()){showToast('Salvataggio non riuscito. Controlla lo spazio del browser.');return}closeModal();go('workout');showToast('Allenamento salvato. Bene così!')}
function exportBackup(){const payload={app:'FITNEX',version:2,exportedAt:new Date().toISOString(),data:state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const href=URL.createObjectURL(blob);const a=document.createElement('a');a.href=href;a.download=`FITNEX-backup-${TODAY()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),1500);showToast('Backup esportato. Conservalo al sicuro.')}
async function importBackup(file){if(!file)return;if(file.size>9_000_000){showToast('Backup troppo grande (max 9 MB).');return}try{const raw=await file.text();const parsed=JSON.parse(raw);const value=parsed?.app==='FITNEX'&&parsed?.version===2?parsed.data:null;if(!value||!Array.isArray(value.foods)||!Array.isArray(value.workouts)||!Array.isArray(value.routines)||!Array.isArray(value.customFoods)){throw Error('Formato di backup non valido')}if(value.foods.length>25000||value.workouts.length>25000||value.routines.length>1000)throw Error('Backup troppo grande');if(!window.confirm('Importare il backup sostituirà tutti i dati FITNEX attuali in questo browser. Continuare?'))return;
const newState={...initialState(),foods:value.foods.filter(f=>f&&typeof f.name==='string').map(f=>({...f,photo:typeof f.photo==='string'&&f.photo.startsWith('data:image/jpeg;base64,')?f.photo:null})),workouts:value.workouts.filter(w=>w&&typeof w.exercise==='string'&&Array.isArray(w.sets)),routines:value.routines.filter(r=>r&&typeof r.name==='string'&&Array.isArray(r.exercises)),customFoods:value.customFoods.filter(f=>f&&typeof f.name==='string'),settings:{...initialState().settings,...value.settings}};state=newState;view.selectedRoutine=null;view.selectedExercise='';saveState();render();showToast('Backup importato correttamente.')}catch(error){console.error(error);showToast('Importazione fallita: file non valido o danneggiato.')}}
function handleAction(el){const action=el.dataset.action,id=el.dataset.id;
switch(action){
case 'navigate':go(el.dataset.page);break;
case 'add-food':openFoodModal(null,el.dataset.food||'',el.dataset.photo==='1');break;
case 'edit-food':openFoodModal(id);break;
case 'delete-food':{const f=state.foods.find(x=>x.id===id);if(f&&confirm(`Eliminare "${f.name}" dal diario?`)){state.foods=state.foods.filter(x=>x.id!==id);saveState();render();showToast('Alimento eliminato.')}break}
case 'food-preset':applyFoodPreset(el.dataset.name);break;
case 'new-routine':openRoutineModal();break;
case 'edit-routine':openRoutineModal(id);break;
case 'select-routine':view.selectedRoutine=id;render();break;
case 'delete-routine':{const r=state.routines.find(x=>x.id===id);if(r&&confirm(`Eliminare la scheda "${r.name}"? Gli allenamenti già registrati rimarranno salvati.`)){state.routines=state.routines.filter(x=>x.id!==id);view.selectedRoutine=null;saveState();render();showToast('Scheda eliminata.')}break}
case 'add-routine-exercise':openRoutineExerciseModal(el.dataset.routine);break;
case 'edit-routine-exercise':openRoutineExerciseModal(el.dataset.routine,id);break;
case 'remove-routine-exercise':{const r=state.routines.find(x=>x.id===el.dataset.routine);const e=r?.exercises?.find(x=>x.id===id);if(e&&confirm(`Rimuovere "${e.name}" dalla scheda?`)){r.exercises=r.exercises.filter(x=>x.id!==id);saveState();render();showToast('Esercizio rimosso dalla scheda.')}break}
case 'log-work':openWorkModal(null,el.dataset.exercise||'',el.dataset.routine||null);break;
case 'edit-work':openWorkModal(id);break;
case 'delete-work':{const record=state.workouts.find(x=>x.id===id);if(record&&confirm(`Eliminare la registrazione di "${record.exercise}" del ${shortDate(record.date)}?`)){state.workouts=state.workouts.filter(x=>x.id!==id);saveState();render();showToast('Registrazione eliminata.')}break}
case 'add-set':{const rows=$('setRows');if(rows.children.length>=20){showToast('Massimo 20 serie per registrazione.');break}const prev=rows.lastElementChild;const kg=prev?.querySelector('.set-kg')?.value||'';rows.insertAdjacentHTML('beforeend',renderSetRow(rows.children.length+1,kg,''));reindexSets();rows.lastElementChild.querySelector('.set-reps').focus();break}
case 'remove-set':{const rows=$('setRows');if(rows.children.length<=1){showToast('Deve restare almeno una serie.');break}el.closest('.set-row').remove();reindexSets();break}
case 'close-modal':closeModal();break;
case 'toggle-theme':state.settings.theme=state.settings.theme==='dark'?'light':'dark';saveState();render();break;
case 'export':exportBackup();break;
case 'import':$('importInput')?.click();break;
case 'clear-data':if(confirm('ATTENZIONE: cancellerai pasti, schede e allenamenti salvati in questo browser. Hai esportato un backup?')){if(confirm('Confermi di voler cancellare definitivamente tutti i dati FITNEX di questo dispositivo?')){const theme=state.settings.theme;state=initialState();state.settings.theme=theme;view.selectedExercise='';view.selectedRoutine=null;saveState();go('overview');showToast('Dati locali cancellati.')}}break;
}}
document.addEventListener('click',e=>{const action=e.target.closest('[data-action]');if(action){e.preventDefault();handleAction(action)}});
$('modalHost').addEventListener('click',e=>{if(e.target===$('modalHost'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&view.modal)closeModal()});
document.addEventListener('submit',e=>{const form=e.target;if(!['foodForm','workoutForm','routineForm','routineExerciseForm','settingsForm'].includes(form.id))return;e.preventDefault();if(form.id==='foodForm')saveFood(form);if(form.id==='workoutForm')saveWorkout(form);if(form.id==='routineForm')saveRoutine(form);if(form.id==='routineExerciseForm')saveRoutineExercise(form);if(form.id==='settingsForm'){const values=Object.fromEntries(new FormData(form).entries());for(const key of ['calories','protein','carbs','fat']){const s=String(values[key]||'').trim();if(s===''){state.settings[key]=null;continue}const v=Number(s);if(!Number.isInteger(v)||v<1||v>10000){showToast('Inserisci numeri validi oppure lascia vuoti gli obiettivi.');return}state.settings[key]=v}saveState();render();showToast('Impostazioni salvate.')}});
document.addEventListener('input',e=>{const id=e.target.id;if(id==='foodSearch'){$('catalogResults').innerHTML=presetButtons(e.target.value)}if(['foodGrams','foodKcal','foodProtein','foodCarbs','foodFat'].includes(id))updateFoodPreview()});
document.addEventListener('change',async e=>{if(e.target.id==='nutritionDate'){view.nutritionDate=e.target.value||TODAY();render()}if(e.target.id==='exerciseSelect'){view.selectedExercise=e.target.value;render()}if(e.target.id==='foodPhoto'){const file=e.target.files?.[0];if(!file)return;const label=$('photoLabel');if(label)label.textContent='Elaborazione foto...';try{const result=await compressPhoto(file);if(view.modal?.type!=='food')return;view.photo=result;const p=$('photoPreview');if(p)p.innerHTML=`<img src="${result}" alt="Foto alimento selezionata">`;if(label)label.textContent='Foto pronta da allegare'}catch(error){showToast(error.message||'Impossibile aprire la foto.');if(label)label.textContent='Foto non disponibile'}}if(e.target.id==='importInput'){await importBackup(e.target.files?.[0]);e.target.value=''}});
$('themeSwitch').addEventListener('click',()=>{state.settings.theme=state.settings.theme==='light'?'dark':'light';saveState();render()});
// Initial save locks migrated v1 records into the new storage key while preserving v1 backup.
saveState();render();
// Installazione offline: il Service Worker conserva i file dell'app sul dispositivo.
function updateConnectionIndicator(){
  const caption=document.getElementById('connectionCaption');
  const dot=document.getElementById('networkDot');
  if(!caption||!dot)return;
  const isOffline=!navigator.onLine;
  dot.classList.toggle('offline',isOffline);
  caption.textContent=isOffline?'OFFLINE · DATI LOCALI':(window.fitnexOfflineReady?'ONLINE · OFFLINE PRONTO':'ONLINE · PREPARAZIONE OFFLINE');
  caption.title=isOffline?'I pasti e gli allenamenti vengono registrati su questo dispositivo':(window.fitnexOfflineReady?'FITNEX può aprirsi senza connessione':'Attendi la preparazione dei file per l’uso offline');
}
window.addEventListener('online',updateConnectionIndicator);
window.addEventListener('offline',updateConnectionIndicator);
updateConnectionIndicator();
if('serviceWorker' in navigator && ['https:','http:'].includes(location.protocol)){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js',{scope:'./'})
      .then(()=>navigator.serviceWorker.ready)
      .then(()=>{window.fitnexOfflineReady=true;updateConnectionIndicator()})
      .catch(err=>{console.warn('FITNEX offline non disponibile:',err);const label=document.getElementById('connectionCaption');if(label&&navigator.onLine)label.textContent='ONLINE · OFFLINE NON PRONTO';});
  });
}else{
  const label=document.getElementById('connectionCaption');
  if(label)label.textContent='APRIRE DA GITHUB PAGES PER OFFLINE';
}
</script>
